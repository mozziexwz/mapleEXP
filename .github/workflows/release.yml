name: Build & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build mapleexp-hans-windows-amd64.exe
        shell: pwsh
        run: python build.py

      - name: Run unit tests
        shell: pwsh
        run: python test_hans.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mapleexp-hans-windows-amd64
          path: |
            dist/mapleexp-hans-windows-amd64.exe
            dist/zh-CN.json
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $template = @'
          ## MapleEXP Hans __TAG__

          零修改外部汉化启动器（适配官方原版 `Maple Classic Exp Overlay`，无需改动官方目录任何文件）。

          ### 快速使用
          1. 下载下方 `mapleexp-hans-windows-amd64.exe` 放到官方 `Maple Classic Exp Overlay` 文件夹旁边。
          2. 直接双击，或命令行运行：
             ```powershell
             .\mapleexp-hans-windows-amd64.exe --app --nogui
             ```
          3. 在悬浮窗右下角 **「…」** 菜单中可随时切换 **简体中文 / English**。

          ### 附件说明
          - `mapleexp-hans-windows-amd64.exe`：独立单文件启动器（内置词典，约 100 KB）
          - `zh-CN.json`：独立界面词典文件（放在 `.exe` 同目录可覆盖内置词典）
          - `SHA256SUMS.txt`：文件 SHA-256 校验值
          '@
          $notes = $template.Replace("__TAG__", $tag)
          Set-Content -Path dist/RELEASE_NOTES.md -Value $notes -Encoding UTF8
          gh release create $tag `
            dist/mapleexp-hans-windows-amd64.exe `
            dist/zh-CN.json `
            dist/SHA256SUMS.txt `
            --title "MapleEXP Hans $tag" `
            --notes-file dist/RELEASE_NOTES.md
